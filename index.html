<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#121425">

    <meta name="description" content="RoleReady is an evidence-first career agent that turns live job posts into truthful Proof Maps, Recruiter Lens insights, and focused preparation plans.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="RoleReady">
    <meta property="og:title" content="Know what a job will question. Before they do.">
    <meta property="og:description" content="RoleReady turns live job posts into truthful Proof Maps, Recruiter Lens insights, and focused preparation plans.">
    <meta property="og:image" content="https://role-ready-one.vercel.app/api/og">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="RoleReady — evidence-first career agent">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Know what a job will question. Before they do.">
    <meta name="twitter:description" content="An evidence-first career agent for live job posts.">
    <meta name="twitter:image" content="https://role-ready-one.vercel.app/api/og">
    <link rel="icon" href="assets/role-ready-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="app.css">
    <style>.extension-ring::before{content:attr(data-score)}.demo-source{display:inline-flex;margin-top:18px;color:#2466c6;font-size:10px;font-weight:750;text-decoration:none}.role-ready-demo-mark{background:#eef5ff;border:1px solid #cbdcf3}.role-ready-demo-mark img{width:24px;height:24px}</style>
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <template id="landing-template">
      <div class="landing-page">
        <nav class="landing-nav" aria-label="RoleReady navigation">
          <a class="landing-brand" href="/"><img src="assets/role-ready-mark.svg" alt=""><span>RoleReady</span></a>
          <div class="landing-nav-actions"><button class="landing-link" id="landing-extension-top" data-open-extension-install>Chrome extension</button><button class="landing-link" id="landing-signin">Sign in</button><button class="landing-cta small" id="landing-demo-top">View live demo <span>↗</span></button></div>
        </nav>
        <main class="landing-main">
          <section class="landing-hero">
            <p class="landing-kicker"><i></i> THE EVIDENCE-FIRST CAREER AGENT</p>
            <h1>Know what a job will <em>question.</em><br>Before they do.</h1>
            <p class="landing-subtitle">RoleReady lives beside the job post. It maps what you can prove, spots the gaps that matter, and turns your next application into a credible plan.</p>
            <div class="landing-actions"><button class="landing-cta" id="landing-demo">Watch it analyze a role <span>→</span></button><button class="landing-secondary-cta" id="landing-extension" data-open-extension-install><span class="mini-extension-mark">R</span> Try the Chrome extension</button><button class="landing-text-action" id="landing-signin-hero">Build my evidence vault <span>↗</span></button></div>
            <p class="landing-trust"><span>✦</span> Truth-first recommendations. Your evidence stays yours.</p>
          </section>
          <section class="product-theater" aria-label="RoleReady product demonstration">
            <div class="theater-glow"></div>
            <div class="browser-demo">
              <div class="browser-bar"><div class="traffic"><i></i><i></i><i></i></div><div class="browser-address"><span>⌕</span> careers.google.com · software-engineering-intern</div><div class="browser-profile">R</div></div>
              <div class="browser-content">
                <article class="demo-posting"><div class="posting-company"><span class="northstar-mark role-ready-demo-mark"><img src="assets/role-ready-mark.svg" alt="RoleReady"></span><div><b>Google</b><small>Official listing snapshot · Sep 12, 2026 · analyzed by RoleReady</small></div></div><p class="demo-label">ENGINEERING · UNITED STATES · MULTIPLE LOCATIONS</p><h2>Software Engineering<br>Intern, BS</h2><div class="demo-chips"><span>Internship</span><span>Summer 2027</span><span>Rolling review</span></div><hr><p class="demo-section-label">WHAT THE LISTING SAYS</p><p class="demo-copy">Build impactful software as part of Google’s engineering organization. The listing asks for students pursuing a relevant bachelor’s degree and experience with a general-purpose programming language.</p><p class="demo-section-label">PREFERRED SIGNALS</p><ul class="demo-requirements"><li><b>Programming languages</b><span>Java · Python · C++</span></li><li><b>Algorithms</b><span>Systems foundations</span></li><li><b>Engineering quality</b><span>Technical judgment</span></li></ul><a class="demo-source" href="https://www.google.com/about/careers/applications/jobs/results/100648618540573382-software-engineering-intern/?page=2" target="_blank" rel="noreferrer">Open official Google Careers listing ↗</a></article>
                <aside class="demo-extension"><header class="extension-head"><div><img src="assets/role-ready-mark.svg" alt=""><span>RoleReady <small>LIVE CONTEXT</small></span></div><button aria-label="More options">•••</button></header><section class="extension-score"><div><p>EVIDENCE FIT</p><b>76<span>%</span></b><small>Good fit · two proof gaps</small></div><div class="extension-ring" data-score="76">76</div></section><section class="extension-insight"><p>RECRUITER LENS</p><b>Your language experience is credible.</b><span>Make algorithms and testing evidence obvious before a technical screen.</span></section><section class="extension-map"><div class="extension-section-head"><p>PROOF MAP</p><span>Truth-first</span></div><div class="extension-row proven"><i>✓</i><div><b>Programming</b><small>JavaScript + Python · Proven</small></div></div><div class="extension-row gap"><i>!</i><div><b>Algorithms</b><small>Needs evidence · Timed Proof Sprint</small></div></div><div class="extension-row gap"><i>!</i><div><b>Testing</b><small>Needs evidence · Add a test plan</small></div></div></section><footer class="extension-foot"><button>View workspace</button><button>Save role</button></footer></aside>
              </div>
            </div>
            <div class="theater-caption"><span><i></i> ANALYZING LISTING SNAPSHOT</span><b>Proof Map ready</b><span>Programming · Algorithms · Testing</span></div>
          </section>
          <section class="landing-proof-points"><article><span>01</span><h2>Read the job in context</h2><p>The extension turns the posting in front of you into a concrete evidence map.</p></article><article><span>02</span><h2>See the real questions</h2><p>Recruiter Lens exposes the parts of your story an interviewer will probe.</p></article><article><span>03</span><h2>Build proof, not fiction</h2><p>Proof Sprints create a credible next step before you ever edit a resume bullet.</p></article></section>
          <section class="extension-bridge" aria-labelledby="extension-bridge-title">
            <div class="extension-bridge-mark"><img src="assets/role-ready-mark.svg" alt=""></div>
            <div class="extension-bridge-copy"><p class="extension-bridge-kicker">CHROME EXTENSION · HACKATHON DEMO</p><h2 id="extension-bridge-title">Bring RoleReady to the job page.</h2><p>Open a listing, then let RoleReady turn the text in front of you into a Proof Map, Recruiter Lens, and a focused next move.</p><div class="extension-bridge-actions"><button class="landing-cta" data-open-extension-install>Install demo build <span>→</span></button><a href="https://github.com/RalphNabh/RoleReady" target="_blank" rel="noreferrer">View the source ↗</a></div></div>
            <div class="extension-bridge-note"><span>DEMO BUILD</span><p>Available as an unpacked Chrome extension while the Chrome Web Store version is in progress.</p></div>
          </section>
        </main>
        <div class="extension-install-backdrop" id="extension-install-modal" hidden>
          <section class="extension-install-dialog" role="dialog" aria-modal="true" aria-labelledby="extension-install-title" tabindex="-1">
            <button class="extension-install-close" type="button" data-close-extension-install aria-label="Close extension installation steps">×</button>
            <div class="extension-install-heading"><div class="extension-install-logo"><img src="assets/role-ready-mark.svg" alt=""></div><div><p>ROLE READY FOR CHROME</p><h2 id="extension-install-title">Install the demo build</h2></div></div>
            <p class="extension-install-intro">RoleReady is currently shared as an open-source hackathon demo. It takes about a minute to add it to Chrome.</p>
            <div class="extension-install-callout"><b>Developer Mode is required.</b><span>This is not a one-click Chrome Web Store install yet.</span></div>
            <ol class="extension-install-steps"><li><span>1</span><div><b>Download the project</b><p>Get the current RoleReady build from GitHub and unzip it.</p></div></li><li><span>2</span><div><b>Open Chrome Extensions</b><p>Type <code>chrome://extensions</code> in Chrome, then enable <strong>Developer mode</strong>.</p></div></li><li><span>3</span><div><b>Load the folder</b><p>Choose <strong>Load unpacked</strong> and select the unzipped RoleReady project folder.</p></div></li><li><span>4</span><div><b>Analyze a job page</b><p>Open a job listing and click the RoleReady icon. The demo works locally right away.</p></div></li></ol>
            <div class="extension-install-actions"><a class="landing-cta" href="https://github.com/RalphNabh/RoleReady/archive/refs/heads/main.zip" target="_blank" rel="noreferrer">Download demo build <span>↓</span></a><a class="extension-source-link" href="https://github.com/RalphNabh/RoleReady" target="_blank" rel="noreferrer">Open GitHub repository ↗</a></div>
            <p class="extension-install-footer">Want the hosted AI connection too? The repository includes the secure configuration steps for your own extension origin and server URL.</p>
          </section>
        </div>
      </div>
    </template>
    <template id="shell-template">
      <aside class="sidebar">
        <a class="brand" href="#home"><img class="brand-mark" src="assets/role-ready-mark.svg" alt=""><span>RoleReady</span></a>
        <p class="workspace">YOUR CAREER OS</p>
        <nav>
          <button data-view="home" class="nav active"><span>⌂</span> Today</button>
          <button data-view="discover" class="nav"><span>⌕</span> Roles</button>
          <button data-view="pipeline" class="nav"><span>▦</span> Calendar</button>
          <button data-view="vault" class="nav"><span>◈</span> Evidence vault</button>
        </nav>
        <div class="sidebar-foot"><p id="auth-status">Loading workspace…</p><button id="auth-button" class="ghost">Sign in with GitHub</button></div>
      </aside>
      <main>
        <header><div><p class="eyebrow" id="header-kicker">EVIDENCE-FIRST CAREER AGENT</p><h1 id="header-title">Your next best move</h1></div><div class="header-actions"><button class="secondary mobile-auth" id="mobile-auth-button">Sign in</button><button class="primary" id="primary-action">Add evidence</button></div></header>
        <section id="view"></section>
      </main>
      <div id="modal-root"></div>
      <div id="toast" role="status"></div>
    </template>
    <script type="module" src="app.js"></script>
  </body>
</html>
